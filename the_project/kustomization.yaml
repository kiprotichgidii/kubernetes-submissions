apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - manifests/configmap.yaml
  - manifests/cronjob.yaml
  - manifests/backup-cronjob.yaml
  - manifests/pvc.yaml
  - manifests/deployment.yaml
  - manifests/gateway-route.yaml
  - manifests/secret.yaml
  - manifests/postgres.yaml

images:
  - name: curlimages/curl
    newTag: latest
  - name: postgres
    newTag: "17"
  - name: todo-app
    newName: gedionkip/k8s-submissions
    newTag: "2.6"
  - name: todo-backend
    newName: gedionkip/k8s-submissions
    newTag: "4.2"
