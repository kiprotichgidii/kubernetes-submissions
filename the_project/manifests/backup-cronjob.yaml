apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: project
spec:
  schedule: "0 0 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: backup
            image: postgres:17-alpine
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -e
                echo "Installing GCloud SDK..."
                apk add --no-cache python3 curl bash
                curl -sSL https://sdk.cloud.google.com | bash
                export PATH=$PATH:/root/google-cloud-sdk/bin

                echo "Authenticating..."
                gcloud auth activate-service-account --key-file=/var/secrets/google/key.json

                echo "Creating backup..."
                PGPASSWORD=$PGPASSWORD pg_dump -h $POSTGRES_HOST -U $POSTGRES_USER $POSTGRES_DB > /tmp/backup.sql

                echo "Uploading to GCS..."
                gsutil cp /tmp/backup.sql gs://gidii-dwk-k8s-backups/backup-$(date +%Y-%m-%d).sql
                echo "Backup complete."
            env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_PORT
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_DB
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            volumeMounts:
            - name: google-cloud-key
              mountPath: /var/secrets/google
              readOnly: true
          restartPolicy: OnFailure
          volumes:
          - name: google-cloud-key
            secret:
              secretName: gcs-key
