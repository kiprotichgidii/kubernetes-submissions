apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong
  labels:
    app: ping-pong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      volumes:
      - name: shared-data
        persistentVolumeClaim:
          claimName: shared-data-pvc
      containers:
      - name: ping-pong
        image: gedionkip/k8s-submissions:1.11.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
        env:
        - name: PORT
          value: "3001"
        - name: COUNT_FILE
          value: "/shared/count.log"
        volumeMounts:
        - name: shared-data
          mountPath: /shared
---
apiVersion: v1
kind: Service
metadata:
  name: ping-pong-svc
spec:
  type: ClusterIP
  selector:
    app: ping-pong
  ports:
  - port: 80
    targetPort: 3001
    protocol: TCP
