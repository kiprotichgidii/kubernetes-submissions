name: Deploy to GKE

on:
  workflow_dispatch:
  #push:

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: europe-north1-b
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: gke-repository
  IMAGE: todo-app
  IMAGE_BACKEND: todo-backend
  SERVICE: todo-app
  BRANCH: ${{ github.ref_name }}

jobs:
  build-publish-deploy:
    name: Build, Publish and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GKE_SA_KEY }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Use gcloud CLI
        run: |
          gcloud info
          gcloud auth list  

      - name: Configure Docker with GCR
        run: |
          gcloud --quiet auth configure-docker ${{ env.REGISTRY }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          project_id: ${{ env.PROJECT_ID }}
          location: ${{ env.GKE_ZONE }}

      - name: Form the image names
        run: |
          echo "IMAGE_FRONTEND=$REGISTRY/$PROJECT_ID/$REPOSITORY/$IMAGE:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV
          echo "IMAGE_BACKEND=$REGISTRY/$PROJECT_ID/$REPOSITORY/$IMAGE_BACKEND:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./the_project
          push: true
          tags: ${{ env.IMAGE_FRONTEND }}

      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./the_project/todo_backend
          push: true
          tags: ${{ env.IMAGE_BACKEND }}

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2.1.0

      - name: Set Namespace
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "NAMESPACE=project" >> $GITHUB_ENV
          else
            echo "NAMESPACE=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Deploy to GKE
        run: |-
          cd the_project
          kubectl create namespace $NAMESPACE || true
          kubectl config set-context --current --namespace=$NAMESPACE
          kustomize edit set namespace $NAMESPACE
          kustomize edit set image todo-app=$IMAGE_FRONTEND
          kustomize edit set image todo-backend=$IMAGE_BACKEND
          kustomize build . | kubectl apply -f -
          kubectl rollout status deployment todo-app
          kubectl get services -o wide