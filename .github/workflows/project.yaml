name: Project GitOps Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - '*'
    paths:
      - 'the_project/**'
      - '.github/workflows/project.yaml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./the_project
          push: true
          tags: gedionkip/k8s-submissions:todo-app-${{ github.sha }}

      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./the_project/todo_backend
          push: true
          tags: gedionkip/k8s-submissions:todo-backend-${{ github.sha }}
      
      - name: Build and push Broadcaster
        uses: docker/build-push-action@v6
        with:
          context: ./the_project/broadcaster
          push: true
          tags: gedionkip/k8s-submissions:broadcaster-${{ github.sha }}

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2.1.0

      - name: Determine Environment
        id: env-selector
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "env=staging" >> $GITHUB_OUTPUT
            echo "kustomize_dir=the_project/overlays/staging" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "env=prod" >> $GITHUB_OUTPUT
            echo "kustomize_dir=the_project/overlays/prod" >> $GITHUB_OUTPUT
          else
            echo "Unknown ref: ${{ github.ref }}"
            exit 1
          fi

      - name: Update Kustomization
        run: |
          cd ${{ steps.env-selector.outputs.kustomize_dir }}
          kustomize edit set image todo-app=gedionkip/k8s-submissions:todo-app-${{ github.sha }}
          kustomize edit set image todo-backend=gedionkip/k8s-submissions:todo-backend-${{ github.sha }}
          kustomize edit set image broadcaster-image=gedionkip/k8s-submissions:broadcaster-${{ github.sha }}

      - name: Commit and Push
        uses: EndBug/add-and-commit@v9
        with:
          add: '${{ steps.env-selector.outputs.kustomize_dir }}/kustomization.yaml'
          message: "Update ${{ steps.env-selector.outputs.env }} images to ${{ github.sha }}"
          push: origin HEAD:main
          pull: '--rebase --autostash origin main'
