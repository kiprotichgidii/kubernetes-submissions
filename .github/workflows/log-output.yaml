name: Log Output GitOps Pipeline

on:
  push:
    paths:
      - 'log_output/**'
      - '.github/workflows/log-output.yaml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Log Generator
        uses: docker/build-push-action@v6
        with:
          context: ./log_output/log_generator
          push: true
          tags: gedionkip/k8s-submissions:log-generator-${{ github.sha }}

      - name: Build and push Log Reader
        uses: docker/build-push-action@v6
        with:
          context: ./log_output/log_reader
          push: true
          tags: gedionkip/k8s-submissions:log-reader-${{ github.sha }}

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2.1.0

      - name: Update Kustomization
        run: |
          kustomize edit set image log-generator=gedionkip/k8s-submissions:log-generator-${{ github.sha }}
          kustomize edit set image log-reader=gedionkip/k8s-submissions:log-reader-${{ github.sha }}

      - name: Commit and Push
        uses: EndBug/add-and-commit@v9
        with:
          add: 'kustomization.yaml'
          message: "Update log_output images to ${{ github.sha }}"
          push: origin HEAD:main
