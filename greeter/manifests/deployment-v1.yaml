apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeter-v1
  namespace: exercises
  labels:
    app: greeter
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greeter
      version: v1
  template:
    metadata:
      labels:
        app: greeter
        version: v1
    spec:
      containers:
      - name: greeter
        image: gedionkip/k8s-submissions:greeter
        imagePullPolicy: IfNotPresent
        env:
        - name: MESSAGE
          value: "Hello from Greeter v1"
