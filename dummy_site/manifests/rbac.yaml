apiVersion: v1
kind: ServiceAccount
metadata:
  name: dummy-site-controller
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dummy-site-controller-role
rules:
  - apiGroups: ["devopsk8s.dwk"]
    resources: ["dummysites"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dummy-site-controller-binding
subjects:
  - kind: ServiceAccount
    name: dummy-site-controller
    namespace: default
roleRef:
  kind: ClusterRole
  name: dummy-site-controller-role
  apiGroup: rbac.authorization.k8s.io
