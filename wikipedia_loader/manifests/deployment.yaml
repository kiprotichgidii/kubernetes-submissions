apiVersion: apps/v1
kind: Deployment
metadata:
  name: wikipedia-loader
  namespace: exercises
  labels:
    app: wikipedia-loader
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wikipedia-loader
  template:
    metadata:
      labels:
        app: wikipedia-loader
    spec:
      volumes:
      - name: shared-content
        emptyDir: {}
      
      initContainers:
      - name: init-content
        image: curlimages/curl
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "Fetching initial content..."
            curl -L https://en.wikipedia.org/wiki/Kubernetes -o /work-dir/index.html
        volumeMounts:
        - name: shared-content
          mountPath: /work-dir

      containers:
      - name: nginx
        image: nginx:1.27
        ports:
        - containerPort: 80
        volumeMounts:
        - name: shared-content
          mountPath: /usr/share/nginx/html

      - name: content-updater
        image: alpine:3.18
        command: ["/bin/sh", "-c"]
        args:
          - |
            apk add --no-cache curl
            while true; do
              # Random sleep between 300 (5m) and 900 (15m) seconds
              SLEEP_TIME=$(shuf -i 300-900 -n 1)
              echo "Sleeping for $SLEEP_TIME seconds..."
              sleep $SLEEP_TIME
              
              echo "Fetching random Wikipedia page..."
              curl -L https://en.wikipedia.org/wiki/Special:Random -o /work-dir/index.html
            done
        volumeMounts:
        - name: shared-content
          mountPath: /work-dir
