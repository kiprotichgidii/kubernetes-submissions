apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
  namespace: exercises
  labels:
    app: log-output
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      containers:
      - name: log-output-generator
        image: log-generator
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: shared-logs
          mountPath: /shared
        env:
        - name: STATUS_FILE
          value: "/shared/status.log"
      - name: log-output-reader
        image: log-reader
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: shared-logs
          mountPath: /shared
        - name: config-volume
          mountPath: /etc/config
        env:
        - name: STATUS_FILE
          value: "/shared/status.log"
        - name: PING_PONG_URL
          value: "http://ping-pong-svc:80/pings"
        - name: MESSAGE
          valueFrom:
            configMapKeyRef:
              name: log-output-config
              key: MESSAGE
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: shared-logs
        emptyDir: {}
      - name: config-volume
        configMap:
          name: log-output-config

---
apiVersion: v1
kind: Service
metadata:
  name: log-output-svc
  namespace: exercises
spec:
  type: ClusterIP
  selector:
    app: log-output
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
